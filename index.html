    const formatGregorianDateTime = (isoString) => {
      if (!isoString) return "غير محدد";
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      const datePart = d.toLocaleDateString('ar-EG', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long'
      });
      const timePart = d.toLocaleTimeString('ar-EG', {
        hour: '2-digit',
        minute: '2-digit'
      });
      return `${datePart} • الساعة ${timePart}`;
    };

    const formatShortGregorian = (isoString) => {
      if (!isoString) return "";
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} - ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;

    const formatRemainingTimeDetailed = (targetIso, nowMs) => {
      const targetMs = new Date(targetIso).getTime();
      const diff = targetMs - nowMs;
      if (diff <= 0) return "حان الموعد الآن 🟢";
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);
      if (days > 0) {
        return `باقي ${days} يوم و ${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `باقي ${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    };

          impactNote = '💼 تأثير فوري: العمدة ومجلس الإدارة مبسوطين من التخطيط (+2% ثقة)!';
        } else if (roleKey === 'performance_analyst') {
          setClub(c => ({
            ...c,
            squad: c.squad.map(p => p.status === 'أساسي' ? { ...p, morale: Math.min(100, (p.morale || 90) + 3) } : p)
          }));

        }

        const nowTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        setStaffChatHistories(prev => ({
          ...prev,
          [roleKey]: [
            ...(prev[roleKey] || []),
            {
              id: 'dir_' + Date.now(),
              sender: 'staff',
              time: nowTime,
              text: `🫡 على راسي يا كوتش! عدّلنا خطة الشغل لـ: "${newDirective}".\n${impactNote}`
            }
          ]
        }));

        showBannerNotification('success', `تم تحديث تعليمات (${targetMember.roleTitle}) إلى "${newDirective}" وتطبيقها على الفرقة!`);
      };

      const handleRefreshStaffMarket = () => {
        setStaffMarketData(prev => ({
          updateNumber: prev.updateNumber + 1,
          lastUpdated: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          candidates: generateStaffMarketCandidates()
        }));
        showBannerNotification('info', '🔄 جبنا لك 4 مدربين جداد تقال في سوق الجهاز الفني!');
      };

      const handleHireStaffCandidate = (candidate) => {
        if (club.budget < candidate.hireCost) {
          showBannerNotification(
            'error',
            `❌ يا كوتش اللي في الخزينة (${club.budget.toLocaleString()} ج) مش مكفي مقدم التعاقد (${candidate.hireCost.toLocaleString()} ج).`
          );
          return;
        }

        const oldStaff = boardStaff.find(s => s.roleKey === candidate.roleKey);

        setClub(c => ({ ...c, budget: c.budget - candidate.hireCost }));
        recordFinancialTransaction('expense', 'جهاز فني', `تعاقد مع ${candidate.name} (${candidate.roleTitle})`, candidate.hireCost);
        pushClubMail('الجهاز الفني', `✍️ تعاقد فني جديد: ${candidate.name}`, `تم التعاقد مع (${candidate.name}) في منصب (${candidate.roleTitle}) بمقدم تعاقد ${candidate.hireCost.toLocaleString()} ج وراتب أسبوعي ${candidate.weeklySalary.toLocaleString()} ج.`);

        setBoardStaff(prev => prev.map(s => {
          if (s.roleKey !== candidate.roleKey) return s;
          return {
            ...s,
            name: candidate.name,
            specialty: candidate.specialty,
            plan: candidate.defaultPlan,
            directives: candidate.directives,
            rating: candidate.rating,
            weeklySalary: candidate.weeklySalary
          };
        }));

        setStaffMarketData(prev => ({
          ...prev,
          candidates: prev.candidates.filter(item => item.marketId !== candidate.marketId)
        }));

        setSelectedStaffRoleKey(candidate.roleKey);
        const nowTime = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        setStaffChatHistories(prev => ({
          ...prev,
          [candidate.roleKey]: [
            ...(prev[candidate.roleKey] || []),
            {
              id: 'hire_' + Date.now(),
              sender: 'staff',
              time: nowTime,
              text: `🎉 شرف كبير ليا أشتغل في (${club.name}) مكان (${oldStaff?.name || 'المدرب السابق'})! تقييمي الفني (${candidate.rating}) وهبدأ فوراً في تنفيذ "${candidate.defaultPlan}".`
            }
          ]
        }));

        showBannerNotification(
          'success',
          `✅ مبروك! تعاقدنا مع ${candidate.name} (${candidate.roleTitle} - تقييم ${candidate.rating}) وخصمنا ${candidate.hireCost.toLocaleString()} ج من الخزينة!`
        );
      };

      useEffect(() => {
        if (activeTab === 'board' && staffChatEndRef.current) {
          staffChatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [staffChatHistories, selectedStaffRoleKey, activeTab]);

      useEffect(() => {
        const validIds = lineupIds.filter(id => club.squad.some(p => p.id === id));
        if (validIds.length < 11) {
          const missingCount = 11 - validIds.length;
          const fillers = club.squad.filter(p => !validIds.includes(p.id)).slice(0, missingCount).map(p => p.id);
          setLineupIds([...validIds, ...fillers]);
        }

        const validTrainIds = trainingPlayerIds.filter(id => club.squad.some(p => p.id === id));
        if (validTrainIds.length < 11) {
          const missingT = 11 - validTrainIds.length;
          const fillersT = club.squad.filter(p => !validTrainIds.includes(p.id)).slice(0, missingT).map(p => p.id);
          setTrainingPlayerIds([...validTrainIds, ...fillersT]);
        }
      }, [club.squad]);

      const recoverInjuredPlayersAfterMatch = () => {
        setClub(c => ({
          ...c,
          squad: c.squad.map(p => {
            if ((p.injuryMatches || 0) > 0) {
              const nextMatches = p.injuryMatches - 1;
              return {
                ...p,
                injuryMatches: nextMatches,
                injuryReason: nextMatches === 0 ? '' : p.injuryReason,
                fitness: nextMatches === 0 ? Math.max(85, p.fitness) : p.fitness
              };
            }
            return p;
          })
        }));
      };

      useEffect(() => {
        if (!trainingSession.active || !trainingSession.endTime) return;

        const finalizeTraining = () => {
          const fitCoach = boardStaff.find(s => s.roleKey === 'fitness_coach');
          const coachEfficiency = (fitCoach?.rating || 90) / 100;
          const facilityBonus = infrastructure.trainingLevel || 1;
          const devPoints = facilityBonus + coachEfficiency;
          const ovrGain = devPoints >= 3.5 ? 2 : 1;
          const participantIds = trainingSession.playerIds;
          const isRecoverySession = trainingSession.type.includes('استشفاء');

          const injuredNames = [];
          const improvedNames = [];

          setClub(prevClub => ({
            ...prevClub,
            squad: prevClub.squad.map(p => {
              if (!participantIds.includes(p.id)) return p;

              const fitnessDrop = isRecoverySession ? -8 : (3 + Math.floor(Math.random() * 3));
              const newFitness = isRecoverySession
                ? Math.min(100, (p.fitness || 90) + 8)
                : Math.max(40, (p.fitness || 95) - fitnessDrop);

              const newRating = Math.min(99, p.rating + ovrGain);
              improvedNames.push(`${p.name} (+${ovrGain} OVR)`);

              let newInjuryMatches = p.injuryMatches || 0;
              let newInjuryReason = p.injuryReason || '';
              if (!isRecoverySession && newFitness < 65 && Math.random() < 0.35) {
                newInjuryMatches = 1 + Math.floor(Math.random() * 2);
                newInjuryReason = 'شد عضلي في التقسيمة';
                injuredNames.push(`${p.name} (${newInjuryMatches} ماتشات)`);
              }

              return {
                ...p,
                rating: newRating,
                fitness: newFitness,
                morale: Math.min(100, (p.morale || 90) + 3),
                injuryMatches: newInjuryMatches,
                injuryReason: newInjuryReason
              };
            })
          }));

          const completionSummary = [
            `✅ خلصت التمرينة (ساعتين بالتمام) وشربنا الشاي المغربي تحت إشراف ${fitCoach?.name || 'د. خالد عبد الفتاح'}!`,
            `📈 مستوى اللاعيبة المشاركين زاد (+${ovrGain} OVR) في (${trainingSession.type} - ${trainingSession.skill}).`,
            injuredNames.length > 0
              ? `⚠️ يا ساتر: (${injuredNames.join('، ')}) جالهم شد عضلي واتحولوا للعيادة.`
              : `💚 الله ينور: كل الرجالة خلصوا التمرينة زي الحصان من غير ولا إصابة.`
          ];

          setTrainingSession(prev => ({
            ...prev,
            active: false,
            startTime: null,
            endTime: null,
            logs: [...completionSummary, ...prev.logs]
          }));

          pushClubMail(
            'التدريب والمعسكر',
            `☕ انتهاء معسكر التدريب بنجاح (+${ovrGain} OVR)`,
            `أتم اللاعبون الحصة التدريبية (${trainingSession.type} - ${trainingSession.skill}) وارتفع تقييمهم الفني (+${ovrGain} OVR).`
          );

          alert(`🎉 خلصت التمرينة بعد ساعتين!\nاللاعيبة زادت قوتهم (+${ovrGain} OVR) واتحدثت لياقتهم في النادي.`);
        };

        if (Date.now() >= trainingSession.endTime) {
          finalizeTraining();
          return;
        }

        const timer = setInterval(() => {
          const now = Date.now();
          setTrainingNowTick(now);
          if (now >= trainingSession.endTime) {
            clearInterval(timer);
            finalizeTraining();
          }
        }, 1000);

        return () => clearInterval(timer);
      }, [trainingSession.active, trainingSession.endTime, infrastructure.trainingLevel, boardStaff]);

      // =========================================================================
      // STRICT GREGORIAN DATE & TIME WATCHER FOR OFFICIAL LEAGUE & CUP MATCHES
      // =========================================================================
      const executeOfficialLeagueMatchById = (matchId, triggeredAutomatically = false) => {
        const targetMatch = leagueSchedule.find(m => m.id === matchId);
        if (!targetMatch || targetMatch.score !== '- vs -') return;

        const scheduledMs = new Date(targetMatch.scheduledAt).getTime();
        if (Date.now() < scheduledMs) {
          alert(`⛔ ممنوع لعب المباراة قبل موعدها الميلادي المحدد!\n📅 الموعد الرسمي: ${formatGregorianDateTime(targetMatch.scheduledAt)}`);
          return;
        }

        const homeGoals = 2 + Math.floor(Math.random() * 2);
        const awayGoals = Math.floor(Math.random() * 2);
        const finalScoreStr = `${homeGoals} - ${awayGoals}`;

        setStandings(prev => prev.map(t => {
          if (t.name === targetMatch.home) {
            const won = homeGoals > awayGoals ? 1 : 0;
            const draw = homeGoals === awayGoals ? 1 : 0;
            const lost = homeGoals < awayGoals ? 1 : 0;
            return {
              ...t,
              played: t.played + 1,
              won: t.won + won,
              draw: t.draw + draw,
              lost: t.lost + lost,
              gf: t.gf + homeGoals,
              ga: t.ga + awayGoals,
              pts: t.pts + (won * 3 + draw)
            };
          }
          return t;
        }));

        setLeagueSchedule(prev => prev.map(m => m.id === matchId ? { ...m, status: 'انتهت في موعدها ✅', score: finalScoreStr } : m));
        setLeagueFinished(true);
        const rev = calculateMatchdayRevenue(infrastructure, true);
        const leaguePrize = 5000000;
        setClub(c => ({ ...c, budget: c.budget + rev.totalMatchdayIncome + leaguePrize }));
        recordFinancialTransaction('income', 'مباريات', `إيراد تذاكر ومنشآت مباراة الدوري (${targetMatch.round})`, rev.totalMatchdayIncome);
        recordFinancialTransaction('income', 'بطولات', `جائزة التتويج ببطولة دوري مراكز شباب الصعيد 🏆`, leaguePrize);
        pushClubMail(
          'نتائج البطولات',
          `🏆 نتيجة مباراة الدوري (${targetMatch.round}): ${finalScoreStr}`,
          `انتهت مباراة ${targetMatch.home} ضد ${targetMatch.away} بنتيجة (${finalScoreStr}) ودخل خزينة النادي +${(rev.totalMatchdayIncome + leaguePrize).toLocaleString()} ج (إيراد الملعب + مكافأة البطولة).`
        );
        recoverInjuredPlayersAfterMatch();
        setCoachStats(s => ({ ...s, tournamentsWon: s.tournamentsWon + 1, leaguePointsAwarded: s.leaguePointsAwarded + 250 }));
        setCoachProfile(p => ({ ...p, xp: p.xp + 1000, trophyHistory: [{ title: `بطل دوري مراكز شباب الصعيد (${club.name}) 🏆`, xpEarned: 1000 }, ...(p.trophyHistory || [])] }));

        pushAdminNotification(
          `انتهاء مباراة الدوري (${targetMatch.round})`,
          `لُعبت مباراة ${targetMatch.home} ضد ${targetMatch.away} في موعدها الميلادي (${formatShortGregorian(targetMatch.scheduledAt)}) وانتهت بنتيجة ${finalScoreStr}.`
        );

        if (!triggeredAutomatically) {
          alert(`🏆 مبروك يا عمدة! لُعبت المباراة في موعدها الميلادي المحدد وانتهت (${finalScoreStr}) وشلنا درع الدوري، ودخل الخزينة +${(rev.totalMatchdayIncome + leaguePrize).toLocaleString()} ج!`);
        }
      };

      const executeOfficialCupMatchById = (matchId, triggeredAutomatically = false) => {
        const targetMatch = cupMatches.find(m => m.id === matchId);
        if (!targetMatch || targetMatch.score !== '- vs -') return;

        const scheduledMs = new Date(targetMatch.scheduledAt).getTime();
        if (Date.now() < scheduledMs) {
          alert(`⛔ ممنوع لعب مباراة الكأس قبل موعدها الميلادي المحدد!\n📅 الموعد الرسمي: ${formatGregorianDateTime(targetMatch.scheduledAt)}`);
          return;
        }

        const homeGoals = 2 + Math.floor(Math.random() * 2);
        const awayGoals = Math.floor(Math.random() * 2);
        const finalScoreStr = `${homeGoals} - ${awayGoals}`;

        setCupMatches(prev => prev.map(m => m.id === matchId ? { ...m, status: 'البطل في موعده 🏆', score: finalScoreStr } : m));
        setCupFinished(true);
        const rev = calculateMatchdayRevenue(infrastructure, true);
        const cupPrize = 4000000;
        setClub(c => ({ ...c, budget: c.budget + rev.totalMatchdayIncome + cupPrize }));
        recordFinancialTransaction('income', 'مباريات', `إيراد تذاكر ومنشآت نهائي الكأس (${targetMatch.round})`, rev.totalMatchdayIncome);
        recordFinancialTransaction('income', 'بطولات', `جائزة التتويج بكأس المعنجرين الصعيدي 🏅`, cupPrize);
        pushClubMail(
          'نتائج البطولات',
          `🏅 نتيجة مباراة الكأس (${targetMatch.round}): ${finalScoreStr}`,
          `فاز ${targetMatch.home} على ${targetMatch.away} بنتيجة (${finalScoreStr}) في كأس المعنجرين ودخل الخزينة +${(rev.totalMatchdayIncome + cupPrize).toLocaleString()} ج.`
        );
        recoverInjuredPlayersAfterMatch();
        setCoachStats(s => ({ ...s, tournamentsWon: s.tournamentsWon + 1 }));
        setCoachProfile(p => ({ ...p, xp: p.xp + 800, trophyHistory: [{ title: `بطل كأس المعنجرين (${club.name}) 🏅`, xpEarned: 800 }, ...(p.trophyHistory || [])] }));

        pushAdminNotification(
          `انتهاء مباراة الكأس (${targetMatch.round})`,
          `لُعبت مباراة ${targetMatch.home} ضد ${targetMatch.away} في موعدها الميلادي (${formatShortGregorian(targetMatch.scheduledAt)}) وانتهت بنتيجة ${finalScoreStr}.`
        );

        if (!triggeredAutomatically) {
          alert(`🏅 الله أكبر! لُعبت مباراة الكأس في موعدها الميلادي المحدد وانتهت (${finalScoreStr}) على ${targetMatch.away}، ودخل الخزينة +${(rev.totalMatchdayIncome + cupPrize).toLocaleString()} ج!`);
        }
      };

      useEffect(() => {
        const timer = setInterval(() => {
          const now = Date.now();
          setRealNowMs(now);

          leagueSchedule.forEach(m => {
            if (m.score === '- vs -' && m.scheduledAt && now >= new Date(m.scheduledAt).getTime()) {
              executeOfficialLeagueMatchById(m.id, true);
            }
          });

          cupMatches.forEach(m => {
            if (m.score === '- vs -' && m.scheduledAt && now >= new Date(m.scheduledAt).getTime()) {
              executeOfficialCupMatchById(m.id, true);
            }
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [leagueSchedule, cupMatches, infrastructure, club.name]);

      // =========================================================================
      // REALISTIC NEGOTIATION MODAL STATE (BUY / LOAN / RENEW / RIVAL PLAYER DEAL)
      // =========================================================================
      const [negotiationModal, setNegotiationModal] = useState(null);

      const openBuyNegotiation = (marketPlayer, dealMode = null) => {
        const resolvedMode = dealMode || (marketPlayer.type === 'loan' ? 'loan' : 'buy');
        if (club.squad.length >= MAX_SQUAD_SIZE) {
          alert(`⛔ القائمة مفوّلة على الآخر (${club.squad.length}/${MAX_SQUAD_SIZE} لاعب) يا كوتش!\nلازم تبيع أو تعير لاعب الأول عشان تفضّي مكان للحريف الجديد.`);
          return;
        }

        if (marketPlayer.club === club.name) {
          alert("⚠️ اللاعب ده معروض من ناديك إنت يا كوتش! تقدر تسحبه من قائمة الانتقالات من صفحة (فرسان المعركة).");
          return;
        }

        const baseRefPrice = resolvedMode === 'loan'
          ? (marketPlayer.loanFee || Math.max(100000, Math.floor(marketPlayer.value * 0.22)))
          : marketPlayer.value;

        const demandMultiplier = marketPlayer.isUserListed
          ? 1.0
          : (1.06 + ((marketPlayer.rating - 70) * 0.004) + (marketPlayer.age < 24 ? 0.03 : 0));

        const requiredAmount = Math.round((baseRefPrice * demandMultiplier) / 5000) * 5000;
        const ownerLabel = marketPlayer.sellerCoach ? `المدرب (${marketPlayer.sellerCoach}) صاحب نادي (${marketPlayer.club})` : `إدارة (${marketPlayer.club})`;

        setNegotiationModal({
          type: resolvedMode, // 'buy' | 'loan' | 'renew'
          player: marketPlayer,
          targetAmount: Math.max(50000, requiredAmount),
          offerInput: String(baseRefPrice),
          attemptsLeft: 3,
          statusMsg: resolvedMode === 'loan'
            ? `🤝 طاولة مفاوضات الإعارة مع ${ownerLabel}: مطلوب حوالي ${baseRefPrice.toLocaleString()} ج لإعارة اللاعب (${marketPlayer.name}) لمدة موسم. اكتب عرضك للتفاوض:`
            : `💸 طاولة مفاوضات الشراء النهائي مع ${ownerLabel}: سعر اللاعب (${marketPlayer.name}) المعروض هو ${baseRefPrice.toLocaleString()} ج. اكتب عرضك وخلّينا نفاصل معاهم:`,
          statusType: 'info'
        });
      };

      const openRivalPlayerDealModal = (rivalTeam, player, dealMode = 'buy') => {
        if (!rivalTeam || !player) return;
        if (rivalTeam.name === club.name || rivalTeam.teamName === club.name) {
          alert("⚠️ ده لاعب في فرقتك إنت يا كوتش!");
          return;
        }
        const formattedMarketObj = {
          id: `rival_${rivalTeam.name || rivalTeam.teamName}_${player.id}`,
          name: player.name,
          pos: player.pos,
          age: player.age,
          rating: player.rating,
          value: player.value,
          loanFee: Math.max(120000, Math.floor(player.value * 0.24)),
          type: dealMode === 'loan' ? 'loan' : 'sale',
          club: rivalTeam.name || rivalTeam.teamName,
          sellerCoach: rivalTeam.coach || rivalTeam.coachName || 'مدرب النادي',
          isUserListed: false
        };
        openBuyNegotiation(formattedMarketObj, dealMode);
      };

      const openRenewNegotiation = (squadPlayer) => {
        const moraleFactor = squadPlayer.morale < 75 ? 1.25 : 1.12;
        const requiredAmount = Math.round(((squadPlayer.value * 0.14) * moraleFactor) / 5000) * 5000;
        setNegotiationModal({
          type: 'renew',
          player: squadPlayer,
          targetAmount: Math.max(50000, requiredAmount),
          offerInput: Math.round(squadPlayer.value * 0.1).toString(),
          attemptsLeft: 3,
          extraYears: 2,
          statusMsg: `وكيل النجم (${squadPlayer.name}) قاعد قدامك عشان يجدد سنتين. الواد مش هيمضي بأقل من ترضية مالية محترمة. اعرض عليه رقمك:`,
          statusType: 'info'
        });
      };

      const handleNegotiationSubmit = (e) => {
        e.preventDefault();
        if (!negotiationModal) return;

        const offer = Number(negotiationModal.offerInput);
        if (!offer || offer <= 0 || isNaN(offer)) {
          setNegotiationModal(prev => ({
            ...prev,
            statusMsg: "⚠️ اكتب رقم صح يا كوتش بلاش هزار!",
            statusType: "error"
          }));
          return;
        }

        if (offer > club.budget) {
          setNegotiationModal(prev => ({
            ...prev,
            statusMsg: `❌ الخزينة مفيهاش غير (${club.budget.toLocaleString()} ج) بس! العرض أكبر من اللي معانا.`,
            statusType: "error"
          }));
          return;
        }

        const { type, player, targetAmount, attemptsLeft } = negotiationModal;
        const minAcceptable = Math.floor(targetAmount * 0.95);

        if (offer >= minAcceptable) {
          if (type === 'buy' || type === 'loan') {
            if (club.squad.length >= MAX_SQUAD_SIZE) {
              alert(`⛔ القائمة مفوّلة (${MAX_SQUAD_SIZE} لاعب)! بيع أو أعير لاعب الأول.`);
              setNegotiationModal(null);
              return;
            }
            const isLoanDeal = type === 'loan';
            setClub(c => ({
              ...c,
              budget: c.budget - offer,
              squad: [
                ...c.squad,
                {
                  ...player,
                  id: Date.now() + Math.floor(Math.random() * 1000),
                  shirtNumber: c.squad.length + 1,
                  fitness: 100,
                  morale: 95,
                  contractYears: isLoanDeal ? 1 : 3,
                  status: 'بديل',
                  injuryMatches: 0,
                  injuryReason: '',
                  onSale: false,
                  onLoan: false,
                  isLoanedIn: isLoanDeal,
                  loanOriginClub: isLoanDeal ? player.club : null
                }
              ]
            }));
            recordFinancialTransaction(
              'expense',
              'انتقالات',
              isLoanDeal
                ? `استعارة اللاعب ${player.name} (${player.pos}) من ${player.club}`
                : `شراء اللاعب ${player.name} (${player.pos}) من ${player.club}`,
              offer
            );
            pushClubMail(
              'سوق الانتقالات',
              isLoanDeal
                ? `🤝 إتمام إعارة اللاعب ${player.name}`
                : `✍️ إتمام شراء اللاعب ${player.name}`,
              `نجحت المفاوضات مع (${player.sellerCoach || player.club}) وتم قيد اللاعب (${player.name}) في قائمتك بقيمة ${offer.toLocaleString()} ج (${isLoanDeal ? 'إعارة لمدة موسم' : 'انتقال نهائي 3 مواسم'}).`
            );
            setMarketPlayers(prev => prev.filter(m => m.id !== player.id));
            pushSaidiNews(
              isLoanDeal ? 'إعارة نجوم الصعيد 🤝' : 'صفقة بيع نارية 💸',
              'خبطة في السوق',
              isLoanDeal
                ? `🤝 رسمياً: نادي (${club.name}) بقيادة (${coachProfile.name}) يستعير النجم (${player.name}) من (${player.club}) مقابل ${offer.toLocaleString()} ج!`

      const handleAutoPickBest11 = () => {

        const price = Number(infra.ticketPrice) || 30;
        const demandFactor = Math.max(0.18, Math.min(1.0, 1.25 - (price / 160) + (isBigMatch ? 0.15 : 0)));
        const attendance = Math.floor(infra.stadiumSeats * demandFactor);
        const ticketIncome = attendance * price;
        const commercialIncome =
          (infra.shopsLevel * 120000) +
          (infra.restaurantsLevel * 180000) +
          (infra.cinemaLevel * 250000) +
          (infra.clothingMallLevel * 320000);
        return {
          attendance,
          fillRate: Math.round((attendance / infra.stadiumSeats) * 100),
          ticketIncome,
          commercialIncome,
          totalMatchdayIncome: ticketIncome + commercialIncome
        };

        if (!file.type.startsWith('image/')) {
          alert('⚠️ من فضلك اختر ملف صورة صحيح (JPG, PNG, WEBP) من الهاتف أو الكمبيوتر!');
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 256;
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxDim) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              }
            } else {
              if (h > maxDim) {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.82);

            setCoachProfile(prev => ({
              ...prev,
              photoUrl: compressedDataUrl
            }));
            if (currentUser) {
              setCurrentUser(prev => prev ? { ...prev, photoUrl: compressedDataUrl } : prev);
              setRegisteredUsers(prev =>
                prev.map(u => (u.id === currentUser.id || u.email === currentUser.email ? { ...u, photoUrl: compressedDataUrl } : u))
              );
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

          title: newGiftTitle.trim() || 'هدية خاصة من الإدارة 🎁',
          rewardType: newGiftType,
          rewardAmount: amount,
          maxUses,
          usedBy: [],
          active: true,
          createdAt: formatShortGregorian(new Date().toISOString())
        };

        setAdminConfig(prev => ({
          ...prev,
          giftCodes: [newCodeObj, ...(prev.giftCodes || [])]
        }));

        pushAdminNotification(
          'توليد كود هدايا جديد 🎁',
          `تم إنشاء كود الهدايا (${formattedCode}) بقيمة (${amount.toLocaleString()}) وعدد استخدامات (${maxUses}).`
        );

        setNewGiftCodeStr('');
        alert(`🎁 تم توليد كود الهدايا بنجاح!\n\nالكود: ${formattedCode}\nيمكن للاعبين تفعيله الآن من داخل (بطاقة الكوتش).`);
      };

      const handleRedeemCoachGiftCode = (e) => {
        e.preventDefault();
        const cleanCode = coachGiftInput.trim().toUpperCase();
        if (!cleanCode) return;

        const allCodes = adminConfig.giftCodes || [];
        const target = allCodes.find(g => g.code.toUpperCase() === cleanCode);

        if (!target) {
          setGiftRedeemFeedback({ type: 'error', text: '❌ كود الهدية ده مش صحيح يا كوتش، اتأكد من الحروف والأرقام!' });
          return;
        }

        if (!target.active) {
          setGiftRedeemFeedback({ type: 'error', text: '⛔ تم إيقاف هذا الكود من قِبل إدارة اللعبة!' });
          return;
        }

        const userIdentifier = currentUser?.email || coachProfile.name;
        const alreadyUsedByCoach = (coachProfile.redeemedGiftCodes || []).includes(cleanCode) || (target.usedBy || []).includes(userIdentifier);

        if (alreadyUsedByCoach) {
          setGiftRedeemFeedback({ type: 'error', text: '⚠️ إنت صرفت هدية الكود ده قبل كده يا عمدة! كل كود بيتصرف مرة واحدة.' });
          return;
        }

        if ((target.usedBy || []).length >= target.maxUses) {
          setGiftRedeemFeedback({ type: 'error', text: '🔒 للأسف الكود ده خلصت كميته ووصل للحد الأقصى من الاستخدام!' });
          return;
        }

        let rewardDescription = '';
        if (target.rewardType === 'budget') {
          setClub(c => ({ ...c, budget: c.budget + target.rewardAmount }));
          recordFinancialTransaction('income', 'مكافآت', `تفعيل كود هدايا الإدارة (${cleanCode})`, target.rewardAmount);
          rewardDescription = `+${target.rewardAmount.toLocaleString()} ج في خزينة النادي 💰`;
        } else if (target.rewardType === 'coins') {
          setCoachProfile(p => ({ ...p, coins: p.coins + target.rewardAmount }));
          rewardDescription = `+${target.rewardAmount.toLocaleString()} عملة ذهبية 🪙`;
        } else if (target.rewardType === 'xp') {
          setCoachProfile(p => ({ ...p, xp: p.xp + target.rewardAmount }));
          rewardDescription = `+${target.rewardAmount.toLocaleString()} نقطة خبرة XP ⭐`;
        }

        pushClubMail('مكافآت الإدارة', `🎁 استلام هدية كود (${cleanCode})`, `تم تفعيل كود الهدايا (${cleanCode}) وإضافة ${rewardDescription}.`);

        setCoachProfile(p => ({
          ...p,
          redeemedGiftCodes: [cleanCode, ...(p.redeemedGiftCodes || [])]
        }));

        setAdminConfig(prev => ({
          ...prev,
          giftCodes: (prev.giftCodes || []).map(g =>
            g.id === target.id
              ? { ...g, usedBy: [...(g.usedBy || []), userIdentifier] }
              : g
          )
        }));

        pushAdminNotification(
          'استرداد كود هدايا 🎁',
          `قام المدرب (${coachProfile.name}) بتفعيل كود الهدايا (${cleanCode}) وحصل على (${rewardDescription}).`
        );

        setCoachGiftInput('');
        setGiftRedeemFeedback({
          type: 'success',
          text: `🎉 مبروك يا كوتش! تم تفعيل كود (${cleanCode}) [${target.title}] وحصلت على: ${rewardDescription}`
        });
      };

      // =========================================================================
      // TRAINING CAMP HANDLERS & DERIVED DATA
      // =========================================================================
      const getRecommendationForPlayer = (player) => {
        if (player.pos === 'GK') {
          return {
            type: 'تدريب الحراس على الصد والرد',
            skill: 'سرعة البديهة والتصدي',
            reason: `مستواه مريح شوية (تقييم ${player.rating}) ومحتاج يشد حيله في الجون`
          };
        }
        if (['CB', 'LB', 'RB', 'CDM'].includes(player.pos)) {
          return {
            type: 'دفاع حديدي وقفل الجبهات',
            skill: 'الجري والتحمل في عز الشمس',
            reason: `مستواه مريح شوية (تقييم ${player.rating}) ومحتاج يزود لياقته وتمركزه`
          };
        }
        if (['CM', 'CAM'].includes(player.pos)) {
          return {
            type: 'هجوم كاسح وفك التكتلات',
            skill: 'الباص السريع وبناء اللعب',
            reason: `مستواه مريح شوية (تقييم ${player.rating}) ومحتاج يظبط الباص في نص الملعب`
          };
        }
        return {
          type: 'هجوم كاسح وفك التكتلات',
          skill: 'الشوط الصاروخي والتهديف',
          reason: `مستواه مريح شوية (تقييم ${player.rating}) ومحتاج يتمرن على الجون`
        };
      };

      const handleLoadLowest11ToTraining = () => {
        if (trainingSession.active) {
          alert("⏳ التمرينة شغالة دلوقتي (ساعتين) ومينفعش نبدل حد غير لما تخلص!");
          return;
        }
        const healthyPlayers = club.squad.filter(p => (p.injuryMatches || 0) === 0);
        const sortedLowest = [...healthyPlayers].sort((a, b) => (a.rating + a.fitness * 0.2) - (b.rating + b.fitness * 0.2));
        const chosen = sortedLowest.slice(0, 11).map(p => p.id);
        setTrainingPlayerIds(chosen);
        alert("⚡ نزلنا أقل 11 لاعب في التقييم واللياقة لأرض الملعب عشان نرفع مستواهم!");
      };

      const handleResetDefaultStartersTraining = () => {
        if (trainingSession.active) {
          alert("⏳ التمرينة شغالة دلوقتي (ساعتين)!");
          return;
        }
        const healthyStarters = lineupIds.filter(id => {
          const pl = club.squad.find(p => p.id === id);
          return pl && (pl.injuryMatches || 0) === 0;
        });
        if (healthyStarters.length >= 11) {
          setTrainingPlayerIds(healthyStarters.slice(0, 11));
        } else {
          const healthyAll = club.squad.filter(p => (p.injuryMatches || 0) === 0).slice(0, 11).map(p => p.id);
          setTrainingPlayerIds(healthyAll);
        }
      };

      const handleSwapTrainingPlayer = (newPlayerId) => {
        if (swapModalTargetIndex === null) return;
        setTrainingPlayerIds(prev => {
          const updated = [...prev];
          updated[swapModalTargetIndex] = newPlayerId;
          return updated;
        });
        setSwapModalTargetIndex(null);
      };

      const handleStartTwoHourTraining = () => {
        if (trainingSession.active) return;
        const participants = trainingPlayerIds
          .map(id => club.squad.find(p => p.id === id))
          .filter(p => p && (p.injuryMatches || 0) === 0);

        if (participants.length === 0) {
          alert("⚠️ اختار لاعيبة سلام الأول (مش مصابين) عشان ينزلوا التمرينة!");
          return;
        }

        const fitCoach = boardStaff.find(s => s.roleKey === 'fitness_coach');
        const now = Date.now();
        const endTime = now + TRAINING_DURATION_MS;
        const p1 = participants[0];
        const p2 = participants[1] || participants[0];

        const initialLogs = [
          `⏱️ صفرنا بداية التمرينة (ساعتين بالتمام • من غير كروتة) — النوع: ${trainingType} | المهارة: ${trainingSkill}.`,
          `🩺 ${fitCoach?.name || 'د. خالد عبد الفتاح'} واقف بالصفارة وبيراقب نفس الـ ${participants.length} لاعب في الملعب.`,
          `🔥 ${p1.name} نازل بروح عالية وبيشوط بضمير في (${trainingSkill})، و${p2.name} مركز مع تعليمات المدرب.`
        ];

        setTrainingSession({
          active: true,
          startTime: now,
          endTime,
          type: trainingType,
          skill: trainingSkill,
          playerIds: participants.map(p => p.id),
          logs: initialLogs
        });
        setTrainingNowTick(now);
      };

      const handleApplyRecommendation = (player) => {
        if (trainingSession.active) {
          alert("⏳ في تمرينة شغالة دلوقتي لمدة ساعتين! استنى لما تخلص.");
          return;
        }
        if ((player.injuryMatches || 0) > 0) {
          alert(`🚑 اللاعب ${player.name} متعور حالياً (هيريح ${player.injuryMatches} ماتشات) ومينفعش ينزل التمرينة.`);
          return;
        }
        const rec = getRecommendationForPlayer(player);
        setTrainingType(rec.type);
        setTrainingSkill(rec.skill);

        setTrainingPlayerIds(prev => {
          if (prev.includes(player.id)) return prev;
          const updated = [...prev];
          if (updated.length >= 11) {
            updated[updated.length - 1] = player.id;
          } else {
            updated.push(player.id);
          }
          return updated;
        });

        if (trainingTopRef.current) {
          trainingTopRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      // Navigation Items (مضاف إليها أيقونة أولاد العم)
      const navItems = [
        { id: 'home_dashboard', label: 'ديوان الكوتش', icon: '🏛️' },
        { id: 'squad', label: 'فرسان المعركة', icon: '👕' },
        { id: 'transfers', label: 'قهوة المزايدات', icon: '💸' },
        { id: 'training', label: 'معسكر الشاي المغربي', icon: '☕' },
        { id: 'fixtures', label: 'ترتيب المعركة', icon: '📊' },
        { id: 'stadium', label: 'ملعب البلدية', icon: '🏟️' },
        { id: 'friendlies', label: 'مراشقة ودية', icon: '⚽' },
        { id: 'media_press', label: 'إعلام وقهوة الصعيد', icon: '📻' },
        { id: 'board', label: 'ديوان العمدة', icon: '👔' },
        { id: 'cousins', label: 'أولاد العم', icon: '🤝' },
        { id: 'youth_league', label: 'دوري العيال والناشئين', icon: '🌱' },
        { id: 'scout', label: 'مخبر الصعيد وكشاف المواهب', icon: '🔍' },
        { id: 'sponsors', label: 'أكابر ورعاة البلد', icon: '💰' }
      ];

      // Maintenance screen for non-admin users if enabled by Admin
      if (adminConfig.gameMaintenance && currentUser && !isOwnerAdmin) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-center space-y-5">
            <div className="text-6xl">🚧⚽🛠️</div>
            <h1 className="text-2xl font-black text-amber-400">اللعبة في صيانة وتطوير من قِبل الإدارة</h1>
            <p className="text-sm text-slate-300 max-w-md">
              عذراً يا كوتش {currentUser.name}، إدارة اللعبة تقوم حالياً بتحديث البطولات وجداول المباريات الميلادية. سنعود للعمل قريباً!
            </p>
            <button
              onClick={() => setCurrentUser(null)}
              className="bg-red-900 hover:bg-red-800 text-white font-black px-5 py-2.5 rounded-xl text-xs"
            >
              تسجيل الخروج
            </button>
          </div>
        );
      }

      if (!currentUser) {

                            <div key={n.id} className={`p-3 rounded-2xl border text-xs ${n.read ? 'bg-slate-950 border-slate-800' : 'bg-amber-950/30 border-amber-500/40'}`}>
                              <div className="flex justify-between font-bold">
                                <span className="text-amber-400">{n.title}</span>
                                <span className="text-[10px] text-slate-400 font-mono">{n.time}</span>
                              </div>
                              <div className="text-slate-300 mt-1">{n.detail}</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {adminActiveTab === 'security' && (
                      <div className="bg-slate-950 border border-amber-500/30 p-5 rounded-2xl space-y-4 text-xs">
                        <h4 className="font-black text-amber-400">🔐 إعدادات أمان وحماية ديوان الأدمن</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-[11px] text-slate-400 block mb-1">الإيميل الرسمي للأدمن (للاسترجاع والإشعارات)</label>
                            <input
                              type="email"
                              value={adminConfig.adminEmail}
                              readOnly
                              className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-emerald-400 font-mono"
                            />
                          </div>
                          <div>
                            <label className="text-[11px] text-slate-400 block mb-1">تغيير الرقم السري لديوان الأدمن</label>
                            <input
                              type="text"
                              value={adminConfig.adminPass}
                              onChange={(e) => setAdminConfig({ ...adminConfig, adminPass: e.target.value })}
                              className="w-full bg-slate-900 border border-amber-500/40 rounded-xl px-3 py-2 text-white font-mono"
                            />
                          </div>
                        </div>
                        <div className="flex flex-wrap gap-2">
                          <button
                            onClick={handleRecoverAdminPassToEmail}
                            className="bg-sky-700 hover:bg-sky-600 text-white font-black px-4 py-2 rounded-xl"
                          >
                            إرسال نسخة من الرقم السري على {ADMIN_EMAIL} 📧
                          </button>
                          <button
                            onClick={() => {
                              setIsAdminUnlocked(false);
                              setShowAdminModal(false);
                            }}
                            className="bg-red-900 hover:bg-red-800 text-white font-black px-4 py-2 rounded-xl"
                          >
                            قفل ديوان الأدمن 🔒
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* BOTTOM FIXED NAVIGATION BAR (القسم الثاني من الأيقونات أسفل الصفحة لسهولة الوصول في كل المتصفحات) */}
          <nav
            aria-label="شريط التنقل السفلي"
            className="fixed bottom-0 inset-x-0 bg-slate-950/95 border-t-2 border-amber-500/40 px-2 py-2 z-40 backdrop-blur-md shadow-[0_-8px_25px_rgba(0,0,0,0.85)] overflow-x-auto"
          >
            <div className="flex items-center justify-around sm:justify-center gap-1.5 max-w-6xl mx-auto min-w-max px-2">
              {navItems.slice(7).map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all relative shrink-0 ${
                    activeTab === item.id
                      ? 'bg-amber-500 text-slate-950 font-black shadow-lg scale-105'
                      : 'bg-slate-900 text-slate-200 hover:bg-slate-800 border border-slate-800'
                  }`}
                >
                  <span className="text-sm">{item.icon}</span>
                  <span>{item.label}</span>
                  {item.id === 'training' && trainingSession.active && (
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  )}
                </button>
              ))}
            </div>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
